<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>走马灯</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      li {
        list-style: none;
      }

      img {
        width: 200px;
      }

      .box {
        width: 600px;
        height: 112px;
        border: 5px solid #000;
        margin: 100px auto;
        overflow: hidden;
      }

      .box ul {
        display: flex;
        animation: move 6s infinite linear;
      }

      /* 先定义位移动画，再定义悬停动画 */
      @keyframes move {
        0% {
          transform: translate(0);
        }
        100% {
          /* 注意这里像素要匹配 */
          transform: translate(-1400px);
        }
      }

      .box:hover ul {
        animation-play-state: paused;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <ul>
        <li><img src="pictures/1.JPG" alt="" /></li>
        <li><img src="pictures/2.JPG" alt="" /></li>
        <li><img src="pictures/3.JPG" alt="" /></li>
        <li><img src="pictures/4.JPG" alt="" /></li>
        <li><img src="pictures/5.JPG" alt="" /></li>
        <li><img src="pictures/6.JPG" alt="" /></li>
        <li><img src="pictures/7.JPG" alt="" /></li>
        <li><img src="pictures/1.JPG" alt="" /></li>
        <li><img src="pictures/2.JPG" alt="" /></li>
        <li><img src="pictures/3.JPG" alt="" /></li>
      </ul>
    </div>
  </body>
</html>
